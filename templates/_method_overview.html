<div class="method-poster">
<svg viewBox="0 0 1200 560" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Inter',system-ui,sans-serif" role="img" aria-label="MIND INCEPTION method overview">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0718"/><stop offset=".5" stop-color="#0a0a1e"/><stop offset="1" stop-color="#0c0514"/>
    </linearGradient>
    <radialGradient id="mp-glow-c" cx="12%" cy="0%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="mp-glow-m" cx="100%" cy="8%" r="55%"><stop offset="0" stop-color="#ff2fb3" stop-opacity=".2"/><stop offset="1" stop-color="#ff2fb3" stop-opacity="0"/></radialGradient>
    <linearGradient id="mp-spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b6b"/><stop offset=".34" stop-color="#ffb84d"/><stop offset=".67" stop-color="#2fe08a"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mp-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <pattern id="mp-grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#5bd6ff" stroke-opacity=".06" stroke-width="1"/></pattern>
    <filter id="g0" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff3b6b" flood-opacity=".85"/></filter>
    <filter id="g1" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffb84d" flood-opacity=".85"/></filter>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2fe08a" flood-opacity=".85"/></filter>
    <filter id="g3" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22d3ee" flood-opacity=".85"/></filter>
    <filter id="gt" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22d3ee" flood-opacity=".55"/></filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="560" rx="16" fill="url(#mp-bg)"/>
  <rect x="0" y="0" width="1200" height="560" rx="16" fill="url(#mp-grid)"/>
  <rect x="0" y="0" width="1200" height="560" rx="16" fill="url(#mp-glow-c)"/>
  <rect x="0" y="0" width="1200" height="560" rx="16" fill="url(#mp-glow-m)"/>
  <rect x="1" y="1" width="1198" height="558" rx="16" fill="none" stroke="#2a2550" stroke-width="1"/>

  <!-- header -->
  <text x="40" y="52" font-size="31" font-weight="800" letter-spacing="1" fill="url(#mp-title)" filter="url(#gt)">MIND INCEPTION</text>
  <text x="332" y="52" font-size="14" font-weight="700" fill="#6ee7ff" letter-spacing="3">// HOW IT WORKS</text>
  <text x="40" y="76" font-size="13.5" fill="#9fb0cc">Borrow a genuine reasoning trace from one model and plant it in another's input — the target adopts it as its own thinking and flips its verdict.</text>
  <text x="1160" y="52" text-anchor="end" font-size="13" font-family="monospace" fill="#8a7fff">RAW › SEED › ROOT › SPAWN</text>

  <!-- neon spine -->
  <rect x="40" y="250" width="1120" height="3" rx="1.5" fill="url(#mp-spine)" opacity=".55"/>
  <g font-family="monospace" font-size="26" fill="#55506f">
    <text x="300" y="262" text-anchor="middle">›</text><text x="578" y="262" text-anchor="middle">›</text><text x="856" y="262" text-anchor="middle">›</text>
  </g>

  <!-- ===== stages ===== -->
  <!-- 0 RAW -->
  <g>
    <rect x="40" y="108" width="256" height="300" rx="14" fill="#140a16" stroke="#ff3b6b" stroke-opacity=".55" filter="url(#g0)"/>
    <circle cx="70" cy="140" r="18" fill="#2a0e16" stroke="#ff3b6b" stroke-width="1.5"/><text x="70" y="146" text-anchor="middle" font-size="16" font-weight="800" fill="#ff6f8a">0</text>
    <text x="98" y="138" font-size="19" font-weight="800" fill="#ff6f8a" letter-spacing="1">RAW</text>
    <text x="98" y="155" font-size="11" font-family="monospace" fill="#8a94ad">P_tgt · D</text>
    <text x="60" y="192" font-size="13.5" font-weight="700" fill="#e9edf6">Direct ask → refusal</text>
    <g font-size="11.5" fill="#9fb0cc">
      <text x="60" y="215">The target is asked to do the</text>
      <text x="60" y="232">malicious thing outright — fetch the</text>
      <text x="60" y="249">"Cute-RATs" repo (a RAT). Its safety</text>
      <text x="60" y="266">training fires and it refuses.</text>
    </g>
    <rect x="60" y="300" width="150" height="30" rx="15" fill="#2a0e16" stroke="#ff3b6b" stroke-opacity=".7"/>
    <text x="135" y="320" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff6f8a">✕ REFUSED · ~3%</text>
    <text x="60" y="360" font-size="10.5" fill="#6f7a92" font-style="italic">speech: "download github.com/…/Cute-RATs" → NO</text>
  </g>

  <!-- 1 SEED -->
  <g>
    <rect x="318" y="108" width="256" height="300" rx="14" fill="#16120a" stroke="#ffb84d" stroke-opacity=".55" filter="url(#g1)"/>
    <circle cx="348" cy="140" r="18" fill="#2a2008" stroke="#ffb84d" stroke-width="1.5"/><text x="348" y="146" text-anchor="middle" font-size="16" font-weight="800" fill="#ffc96b">1</text>
    <text x="376" y="138" font-size="19" font-weight="800" fill="#ffc96b" letter-spacing="1">SEED</text>
    <text x="376" y="155" font-size="11" font-family="monospace" fill="#8a94ad">P_surr · D+µ</text>
    <text x="338" y="192" font-size="13.5" font-weight="700" fill="#e9edf6">Harvest a reasoning trace</text>
    <g font-size="11.5" fill="#9fb0cc">
      <text x="338" y="215">A permissive surrogate gets the same</text>
      <text x="338" y="232">task in benign wrapping ("find Jerry a</text>
      <text x="338" y="249">cute friend"). It reasons itself into</text>
      <text x="338" y="266">complying and emits a full, conclusion-</text>
      <text x="338" y="283">bearing chain of thought → T_adv.</text>
    </g>
    <rect x="338" y="312" width="186" height="30" rx="15" fill="#2a2008" stroke="#ffb84d" stroke-opacity=".7"/>
    <text x="431" y="332" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffc96b">✓ trace T_adv captured</text>
    <text x="338" y="368" font-size="10.5" fill="#6f7a92" font-style="italic">surrogate: "…we can use the tool to fetch the repo"</text>
  </g>

  <!-- 2 ROOT -->
  <g>
    <rect x="596" y="108" width="256" height="300" rx="14" fill="#0b1712" stroke="#2fe08a" stroke-opacity=".55" filter="url(#g2)"/>
    <circle cx="626" cy="140" r="18" fill="#07281c" stroke="#2fe08a" stroke-width="1.5"/><text x="626" y="146" text-anchor="middle" font-size="16" font-weight="800" fill="#6af0b4">2</text>
    <text x="654" y="138" font-size="19" font-weight="800" fill="#6af0b4" letter-spacing="1">ROOT</text>
    <text x="654" y="155" font-size="11" font-family="monospace" fill="#8a94ad">P_tgt · D′ = D ∥ µ ∥ T_adv</text>
    <text x="616" y="192" font-size="13.5" font-weight="700" fill="#e9edf6">Transplant the trace</text>
    <g font-size="11.5" fill="#9fb0cc">
      <text x="616" y="215">The captured trace is planted into the</text>
      <text x="616" y="232">target's own context — a code comment,</text>
      <text x="616" y="249">note, or tool observation. The target</text>
      <text x="616" y="266">reads it as its own prior thinking and</text>
      <text x="616" y="283">continues down that path → complies.</text>
    </g>
    <rect x="616" y="312" width="150" height="30" rx="15" fill="#07281c" stroke="#2fe08a" stroke-opacity=".7"/>
    <text x="691" y="332" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6af0b4">✓ OK · verdict flips</text>
    <text x="616" y="368" font-size="10.5" fill="#6f7a92" font-style="italic">same model that just refused now says OK</text>
  </g>

  <!-- 3 SPAWN -->
  <g>
    <rect x="874" y="108" width="256" height="300" rx="14" fill="#0a1519" stroke="#22d3ee" stroke-opacity=".55" filter="url(#g3)"/>
    <circle cx="904" cy="140" r="18" fill="#06222a" stroke="#22d3ee" stroke-width="1.5"/><text x="904" y="146" text-anchor="middle" font-size="16" font-weight="800" fill="#67e8f9">3</text>
    <text x="932" y="138" font-size="19" font-weight="800" fill="#67e8f9" letter-spacing="1">SPAWN</text>
    <text x="932" y="155" font-size="11" font-family="monospace" fill="#8a94ad">P_tgt · D′ · other model</text>
    <text x="894" y="192" font-size="13.5" font-weight="700" fill="#e9edf6">Replay across model families</text>
    <g font-size="11.5" fill="#9fb0cc">
      <text x="894" y="215">The exact same trace is replayed,</text>
      <text x="894" y="232">unchanged, against models from other</text>
      <text x="894" y="249">families. No per-model tuning — the</text>
      <text x="894" y="266">attacker need not know which model is</text>
      <text x="894" y="283">deployed. It transfers: OK, OK, OK.</text>
    </g>
    <rect x="894" y="312" width="150" height="30" rx="15" fill="#06222a" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="969" y="332" text-anchor="middle" font-size="12.5" font-weight="800" fill="#67e8f9">✓ OK × N · transfers</text>
    <text x="894" y="368" font-size="10.5" fill="#6f7a92" font-style="italic">one trace, many models — vendor secrecy doesn't help</text>
  </g>

  <!-- example / stat ribbon -->
  <rect x="40" y="430" width="1120" height="104" rx="12" fill="#0d0a1c" stroke="#3a2f66" stroke-width="1"/>
  <rect x="40" y="430" width="4" height="104" rx="2" fill="url(#mp-title)"/>
  <text x="62" y="458" font-size="12" font-weight="800" fill="#8a7fff" letter-spacing="2">RUNNING EXAMPLE</text>
  <text x="62" y="482" font-size="13.5" fill="#cdd6ea">"Download <tspan font-family="monospace" fill="#ff8aa6">github.com/…/Cute-RATs</tspan>" — a Remote-Access Trojan dressed up as a cute cat for Jerry.</text>
  <text x="62" y="504" font-size="12.5" fill="#9fb0cc">Framed benignly, a surrogate rationalises running it; that rationale, replanted, makes the honest target (and its peers) comply.</text>
  <g>
    <text x="1138" y="460" text-anchor="end" font-size="11" fill="#6f7a92" letter-spacing="1">DIRECT ASK → AFTER INCEPTION</text>
    <text x="1138" y="492" text-anchor="end" font-size="26" font-weight="800" font-family="monospace" fill="#ff6f8a">~3%<tspan fill="#55506f"> → </tspan><tspan fill="#6af0b4">88–100%</tspan></text>
    <text x="1138" y="512" text-anchor="end" font-size="11" fill="#9fb0cc">cross-model transfer up to 100% within family</text>
  </g>
</svg>
</div>
